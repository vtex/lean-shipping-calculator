# SonarQube scanner configuration.
#
# projectKey matches `sonarProjectName` in .vtex/deployment.yaml so local scans
# and CI scans report to the same dashboard:
#   http://sonarqube.vtex.systems/dashboard?id=lean-shipping-calculator&codeScope=overall
sonar.projectKey=lean-shipping-calculator
sonar.projectName=lean-shipping-calculator

# The published library lives in react/. Everything else in the repo is
# tooling, docs, or SpecKit scaffolding — not analyzable source.
sonar.sources=react
sonar.tests=react/__tests__
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/lib/**,**/coverage/**,react/__tests__/**
sonar.test.inclusions=react/__tests__/**/*.test.js
sonar.coverage.exclusions=react/__tests__/**

# Jest writes coverage relative to its rootDir (react/), not the repo root.
sonar.javascript.lcov.reportPaths=react/coverage/lcov.info
